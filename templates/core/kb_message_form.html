{% extends "core/base.html" %}
{% block title %}{{ mode|title }} Message | ICDRS{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-cyan-400">{{ mode|title }} Knowledge Base Message</h1>
        <a href="{% url 'kb_message_list' %}" class="text-sm text-slate-400 hover:text-cyan-400">← Back to List</a>
    </div>
    <form method="post" class="card-glass rounded-xl p-6 space-y-5">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Message Content *</label>
            <textarea name="content" rows="4" required class="w-full rounded-lg border border-slate-700 bg-slate-900/80 px-4 py-2 text-slate-100 focus:border-cyan-500 focus:outline-none">{% if mode == 'edit' %}{{ obj.content }}{% endif %}</textarea>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Classification *</label>
                <select name="classification" required class="w-full rounded-lg border border-slate-700 bg-slate-900/80 px-4 py-2 text-slate-100 focus:border-cyan-500 focus:outline-none">
                    <option value="fraudulent" {% if mode == 'edit' and obj.classification == 'fraudulent' %}selected{% endif %}>Fraudulent</option>
                    <option value="legitimate" {% if mode == 'edit' and obj.classification == 'legitimate' %}selected{% endif %}>Legitimate</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Fraud Category (if applicable)</label>
                <input type="text" name="fraud_category" value="{% if mode == 'edit' %}{{ obj.fraud_category }}{% endif %}" class="w-full rounded-lg border border-slate-700 bg-slate-900/80 px-4 py-2 text-slate-100 focus:border-cyan-500 focus:outline-none">
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Keywords (comma-separated)</label>
            <input type="text" name="keywords" value="{% if mode == 'edit' %}{{ obj.keywords }}{% endif %}" placeholder="e.g., urgent, verify, click here" class="w-full rounded-lg border border-slate-700 bg-slate-900/80 px-4 py-2 text-slate-100 focus:border-cyan-500 focus:outline-none">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Source Description</label>
            <input type="text" name="source_description" value="{% if mode == 'edit' %}{{ obj.source_description }}{% endif %}" class="w-full rounded-lg border border-slate-700 bg-slate-900/80 px-4 py-2 text-slate-100 focus:border-cyan-500 focus:outline-none">
        </div>
        <div class="flex items-center gap-2 pt-2">
            <input type="checkbox" name="is_active" id="is_active" {% if mode != 'edit' or obj.is_active %}checked{% endif %} class="w-4 h-4 rounded border-slate-700 bg-slate-900 text-cyan-500 focus:ring-cyan-500">
            <label for="is_active" class="text-sm text-slate-300">Active (used in detection)</label>
        </div>
        <div class="flex gap-4 pt-4 border-t border-slate-700">
            <button type="submit" class="rounded-lg bg-cyan-600 px-6 py-2.5 text-sm font-semibold text-white hover:bg-cyan-500 transition">Save Message</button>
            <a href="{% url 'kb_message_list' %}" class="rounded-lg border border-slate-700 px-6 py-2.5 text-sm font-semibold text-slate-300 hover:bg-slate-800 transition">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
