{% extends "core/base.html" %}
{% block title %}{{ mode|title }} URL | ICDRS{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto">
    <h1 class="text-2xl font-bold text-cyan-400 mb-6">{{ mode|title }} Knowledge Base URL</h1>
    <form method="post" class="card-glass rounded-xl p-6 space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Full URL *</label>
            <input type="url" name="url" required value="{% if mode == 'edit' %}{{ obj.url }}{% endif %}" class="w-full rounded-lg border border-slate-700 bg-slate-900/80 px-4 py-2 text-slate-100 focus:border-cyan-500 focus:outline-none">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Classification *</label>
            <select name="classification" required class="w-full rounded-lg border border-slate-700 bg-slate-900/80 px-4 py-2 text-slate-100 focus:border-cyan-500 focus:outline-none">
                <option value="phishing" {% if mode == 'edit' and obj.classification == 'phishing' %}selected{% endif %}>Phishing</option>
                <option value="legitimate" {% if mode == 'edit' and obj.classification == 'legitimate' %}selected{% endif %}>Legitimate</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Description</label>
            <input type="text" name="description" value="{% if mode == 'edit' %}{{ obj.description }}{% endif %}" class="w-full rounded-lg border border-slate-700 bg-slate-900/80 px-4 py-2 text-slate-100 focus:border-cyan-500 focus:outline-none">
        </div>
        <div class="flex items-center gap-2">
            <input type="checkbox" name="is_active" id="is_active" {% if mode != 'edit' or obj.is_active %}checked{% endif %} class="rounded border-slate-700 bg-slate-900 text-cyan-500 focus:ring-cyan-500">
            <label for="is_active" class="text-sm text-slate-300">Active (used in detection)</label>
        </div>
        <div class="flex gap-4 pt-4">
            <button type="submit" class="rounded-lg bg-cyan-600 px-6 py-2 text-sm font-semibold text-white hover:bg-cyan-500">Save URL</button>
            <a href="{% url 'kb_url_list' %}" class="rounded-lg border border-slate-700 px-6 py-2 text-sm font-semibold text-slate-300 hover:bg-slate-800">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
